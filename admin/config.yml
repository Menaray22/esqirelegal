backend:
  name: git-gateway
  branch: main

# Netlify Identity + Git Gateway handle login and write access — no
# separate OAuth app to run. See README.md, "Setting up /admin access".

media_folder: "images"
public_folder: "/images"

# publish_mode intentionally omitted (defaults to "simple" — every save
# commits straight to `main` and goes live on the next deploy, ~1-2
# minutes later). The alternative, "editorial_workflow", makes every save
# open a GitHub pull request + a separate deploy-preview URL for review
# instead — built for multi-person teams, and just friction for a single
# site owner. See README.md, "Publishing: direct vs. editorial workflow".

collections:
  - name: "settings"
    label: "Site Settings"
    files:
      - file: "content/settings.json"
        label: "Contact & Social"
        name: "settings"
        description: >
          Phone numbers, emails, business hours, and social links. These
          feed the footer on every page and the Contact page directly —
          changes here go live without touching any HTML.
        fields:
          - label: "Phone Numbers"
            name: "phones"
            widget: "list"
            hint: "In order — the first two also appear in the footer."
          - label: "Email Addresses"
            name: "emails"
            widget: "list"
          - label: "Business Hours"
            name: "hours"
            widget: "object"
            fields:
              - { label: "Weekday line", name: "weekday", widget: "string" }
              - { label: "Saturday line", name: "saturday", widget: "string" }
              - { label: "Sunday line", name: "sunday", widget: "string" }
          - label: "Social Links"
            name: "social"
            widget: "object"
            fields:
              - { label: "LinkedIn URL", name: "linkedin", widget: "string" }
              - { label: "X (Twitter) URL", name: "twitter", widget: "string" }
              - { label: "Instagram URL", name: "instagram", widget: "string" }

  - name: "blog"
    label: "Blog"
    folder: "blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} — {{date}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Author", name: "author", widget: "string", default: "Esquires' Legal" }
      - { label: "Featured Image", name: "featured_image", widget: "image", required: false }
      - { label: "Categories", name: "categories", widget: "list", required: false }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Draft", name: "draft", widget: "boolean", default: true, hint: "Keep on until the post is ready to publish." }
      - { label: "Excerpt", name: "excerpt", widget: "text", required: false }
      - { label: "Body", name: "body", widget: "markdown" }
