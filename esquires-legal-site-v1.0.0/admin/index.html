<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager — Esquires' Legal</title>
  <link rel="icon" href="../images/favicon.svg" type="image/svg+xml" />
  <!-- Keeping this out of search results -->
  <meta name="robots" content="noindex" />
  <!--
    Required for the git-gateway backend's login flow. Without this,
    clicking "Login" in Decap CMS has nothing to authenticate against.
    See README.md, "A known risk: Netlify Identity" before going live.
  -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <!-- Decap CMS, loaded from the CDN — no build step required -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // If someone reaches /admin via an invite-email link before Identity
    // has finished initializing, send them back here once login completes.
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", function (user) {
        if (!user) {
          window.netlifyIdentity.on("login", function () {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
